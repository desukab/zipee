[package]
name = "zipee-engine"
description = "Archive engine for Zipee: safe browsing, inspection, extraction and editing of archives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# `rlib` keeps `cargo test` working; `staticlib` is what the macOS app links.
# Without it, cargo emits only an rlib and `swiftc -lzipee_engine` has nothing
# to link against -- which is exactly how the first macOS build failed.
crate-type = ["rlib", "staticlib"]

[dependencies]
zip.workspace = true
crc32fast.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"