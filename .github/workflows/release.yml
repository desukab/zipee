---
# Cut a Zipee release by pushing a version tag.
#
# The .pkg is not built here. It is built, installed and checksummed by
# macos.yml, which uploads it as a per-runner artifact. This workflow waits for
# that build to finish on the tagged commit, downloads the artifact it
# produced, and attaches it to the GitHub release. Building here instead would
# create a second build path that can drift from the one people verify.
#
# Usage:
#   git tag v0.2.0 && git push origin v0.2.0
#
# Or dispatch manually with an explicit existing tag.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v0.2.0)'
        required: true

permissions:
  # Create/update the release and upload its assets.
  contents: write
  # Required to download the artifacts produced by macos.yml. Without this the
  # download step fails with 403 even though the release itself is permitted.
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "no tag resolved" >&2
            exit 1
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify tag exists on the remote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.value }}"
          # API rather than git: this job deliberately does not check out the
          # repository, so there is no local .git for `git rev-parse` to read.
          if ! gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG does not exist on the remote"
            exit 1
          fi
          echo "tag $TAG confirmed"

      - name: Wait for the macOS build of this exact commit
        uses: actions/github-script@v7
        id: find_run
        with:
          result-encoding: string
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = '${{ steps.tag.outputs.value }}';

            // Resolve tag -> commit. An annotated tag's ref points at a tag
            // object; a lightweight tag's ref points straight at the commit.
            // github-script wraps every response in .data.
            const ref = (await github.rest.git.getRef({
              owner, repo, ref: `tags/${tag}`
            })).data.object;

            let commit = ref.sha;
            if (ref.type === 'tag') {
              commit = (await github.rest.git.getTag({
                owner, repo, tag_sha: ref.sha
              })).data.object.sha;
            }
            core.info(`tag ${tag} resolves to commit ${commit}`);

            // Poll for macos.yml to finish on that commit. Both workflows are
            // triggered by the same tag push, so the build may not have
            // registered yet on the first pass.
            //
            // listWorkflowRuns (the /workflows/{id}/runs endpoint), not
            // listWorkflowRunsForRepo: the latter has no workflow_id parameter,
            // silently ignores it, and returns every run in the repo — which
            // picks up the concurrent engine run instead of the macOS build.
            for (let i = 0; i < 30; i++) {
              const runs = (await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'macos.yml',
                head_sha: commit, per_page: 20
              })).data.workflow_runs;

              const done = runs.find(r => r.status === 'completed');
              if (done) {
                if (done.conclusion !== 'success') {
                  core.setFailed(
                    `macos.yml concluded '${done.conclusion}' on ${commit}; ` +
                    `refusing to publish an unverified package`
                  );
                  return;
                }
                core.info(`using macos.yml run ${done.id}`);
                return done.id;
              }
              await new Promise(r => setTimeout(r, 20000));
            }
            core.setFailed('macos.yml did not complete on the tagged commit');

      - name: Download the preferred (macos-15) package
        id: dl15
        # continue-on-error so a missing macos-15 artifact falls through to the
        # fallback instead of aborting the job and skipping every later step.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: Zipee-macOS-pkg-macos-15
          path: dist
          run-id: ${{ steps.find_run.outputs.result }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the fallback (macos-14) package
        if: steps.dl15.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: Zipee-macOS-pkg-macos-14
          path: dist
          run-id: ${{ steps.find_run.outputs.result }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure exactly one package was downloaded
        run: |
          set -euo pipefail
          ls -l dist/
          count="$(ls dist/*.pkg 2>/dev/null | wc -l)"
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one .pkg, found $count"
            exit 1
          fi

      - name: Confirm the artifact is a real installer
        run: |
          set -euo pipefail
          pkg="$(ls dist/*.pkg)"
          # A macOS .pkg is a XAR container: its first four bytes are "xar!".
          # Checked by magic bytes rather than with `xar`, which is a macOS
          # tool and this job runs on ubuntu-latest.
          magic="$(head -c 4 "$pkg")"
          if [ "$magic" != "xar!" ]; then
            echo "::error::$pkg is not a XAR package (first bytes: '$magic')"
            exit 1
          fi
          echo "$pkg is a XAR package"

      - name: Fail if the checksum in SHA256SUMS.txt does not match
        working-directory: dist
        run: |
          set -euo pipefail
          pkg="$(ls *.pkg)"
          expected="$(awk '{print $1}' SHA256SUMS.txt)"
          actual="$(sha256sum "$pkg" | cut -d' ' -f1)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::checksum mismatch — manifest says $expected, artifact is $actual"
            exit 1
          fi
          echo "checksum verified: $actual"

      - name: Build the release body from the manifest
        working-directory: dist
        run: |
          set -euo pipefail
          {
            echo "## Install"
            echo
            echo 'This build is **unsigned**. Gatekeeper will refuse it until you allow it.'
            echo
            echo '```sh'
            echo "installer -pkg $(ls *.pkg) -target /"
            echo 'xattr -dr com.apple.quarantine /Applications/Zipee.app'
            echo '```'
            echo
            echo 'Then right-click the app → Open → Open Anyway. Or build from source:'
            echo
            echo '```sh'
            echo 'git clone https://github.com/desukab/zipee.git && cd zipee'
            echo './scripts/build-macos.sh'
            echo '```'
            echo
            echo '## Verify'
            echo
            echo 'Because this build is unsigned, the checksum is the only integrity'
            echo 'check available:'
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo
            echo '## Build manifest'
            echo
            echo '```'
            cat release-manifest.txt
            echo '```'
            echo
            echo '## What is not verified'
            echo
            echo '- The GUI has never been launched — a CI runner has no GUI session.'
            echo '- The Swift XCTest suite is not running. See `docs/release-status.md`.'
            echo '- Finder integration is declared but unexercised.'
            echo '- Gatekeeper behaviour is unobserved.'
            echo
            echo 'Full ledger: [`docs/release-status.md`](https://github.com/desukab/zipee/blob/main/docs/release-status.md)'
          } > release-body.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.value }}"
          VERSION="${TAG#v}"

          # Re-publishing an existing tag updates assets rather than failing,
          # so a re-run after a fixed build is a no-op.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — updating assets"
            gh release upload "$TAG" dist/*.pkg dist/SHA256SUMS.txt dist/release-manifest.txt --clobber
            gh release edit "$TAG" --title "Zipee $VERSION" --notes-file dist/release-body.md
          else
            gh release create "$TAG" \
              --title "Zipee $VERSION" \
              --notes-file dist/release-body.md \
              dist/*.pkg dist/SHA256SUMS.txt dist/release-manifest.txt
          fi

      - name: Summary
        run: |
          {
            echo "### Released ${{ steps.tag.outputs.value }}"
            echo
            echo "Build run ${{ steps.find_run.outputs.result }} passed the macOS"
            echo "build, package, install, bundle-format and checksum gates."
            echo
            echo "[View release](https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.value }})"
          } >> "$GITHUB_STEP_SUMMARY"
